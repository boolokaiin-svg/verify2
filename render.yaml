services:
  - type: web
    name: property-verification-agent
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORTAL_MODE
        value: http
      - key: OCR_MAX_WORKERS
        value: "2"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TNREGINET_USERNAME
        sync: false
      - key: TNREGINET_PASSWORD
        sync: false
